<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌍 Magnetósfera Terrestre · NASA Live</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Segoe UI', -apple-system, sans-serif; }
  #renderCanvas { width: 100%; height: 100%; touch-action: none; display: block; outline: none; }

  #hud {
    position: absolute; top: 18px; left: 18px;
    background: linear-gradient(135deg, rgba(0,15,35,0.82), rgba(0,8,20,0.68));
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    padding: 16px 20px; border-radius: 14px;
    border: 1px solid rgba(120,200,255,0.18);
    box-shadow: 0 8px 40px rgba(0,0,0,0.5), inset 0 0 20px rgba(80,180,255,0.04);
    pointer-events: none; z-index: 100; min-width: 260px;
    font-family: 'Courier New', monospace;
  }
  #hud h1 { font-size: 11px; letter-spacing: 3px; color: #7ec8ff; text-transform: uppercase; margin-bottom: 12px; font-weight: 600; }
  .data-row { display: flex; justify-content: space-between; align-items: center; margin: 7px 0; font-size: 12px; }
  .label { color: #6a8aa5; letter-spacing: 1px; }
  .value { color: #e8f4ff; font-weight: 600; font-size: 14px; }
  .value.alert { color: #ff5c7a; }
  .value.warn { color: #ffcc55; }
  .value.ok { color: #6ee8a5; }

  #status-panel {
    position: absolute; bottom: 18px; left: 18px;
    padding: 12px 18px;
    background: linear-gradient(135deg, rgba(0,15,35,0.82), rgba(0,8,20,0.68));
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border-radius: 12px; border: 1px solid rgba(120,200,255,0.15);
    color: #7ec8ff; font-family: 'Courier New', monospace;
    z-index: 100; letter-spacing: 2px; font-size: 11px; text-transform: uppercase;
  }
  #status-value { font-size: 16px; font-weight: 800; letter-spacing: 4px; margin-top: 3px; display: block; transition: color 0.4s; }
  #status-value.calm { color: #6ee8a5; }
  #status-value.perturbed { color: #ffcc55; }
  #status-value.storm { color: #ff5c7a; animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }

  #timestamp-panel {
    position: absolute; bottom: 18px; right: 18px;
    padding: 9px 16px; background: rgba(0,12,25,0.65);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-radius: 8px; border: 1px solid rgba(120,200,255,0.1);
    color: #5a7a95; font-family: 'Courier New', monospace;
    font-size: 10px; letter-spacing: 1px; z-index: 100; text-align: right;
  }

  #controls-info {
    position: absolute; top: 18px; right: 18px;
    padding: 9px 14px; background: rgba(0,12,25,0.55);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-radius: 8px; border: 1px solid rgba(120,200,255,0.1);
    color: #5a7a95; font-family: 'Courier New', monospace;
    font-size: 10px; letter-spacing: 1px; z-index: 100; line-height: 1.7;
  }
  #controls-info b { color: #7ec8ff; }

  #loading {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: #000; color: #7ec8ff;
    font-family: 'Courier New', monospace; letter-spacing: 4px;
    z-index: 200; transition: opacity 1.2s;
    flex-direction: column; gap: 18px;
  }
  #loading.hidden { opacity: 0; pointer-events: none; }
  .loader-ring {
    width: 50px; height: 50px;
    border: 2px solid rgba(120,200,255,0.12);
    border-top-color: #7ec8ff; border-radius: 50%;
    animation: spin 1.2s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loading-text { font-size: 10px; }

  #flash-overlay {
    position: absolute; inset: 0;
    background: radial-gradient(circle at center, rgba(255,60,90,0.25), transparent 70%);
    opacity: 0; pointer-events: none; z-index: 150; transition: opacity 0.6s;
  }

  @media (max-width: 640px) {
    #hud { transform: scale(0.78); transform-origin: top left; }
    #status-panel { transform: scale(0.82); transform-origin: bottom left; }
    #controls-info { display: none; }
  }
</style>
<script src="https://cdn.babylonjs.com/babylon.js"></script>
</head>
<body>
<canvas id="renderCanvas"></canvas>
<div id="flash-overlay"></div>

<div id="loading">
  <div class="loader-ring"></div>
  <div id="loading-text">CARGANDO MAGNETOSFERA...</div>
</div>

<div id="hud">
  <h1>◈ TELEMETRÍA NASA EN VIVO</h1>
  <div class="data-row"><span class="label">Bz (GSM)</span><span id="val-bz" class="value">--</span></div>
  <div class="data-row"><span class="label">Velocidad</span><span id="val-speed" class="value">--</span></div>
  <div class="data-row"><span class="label">Densidad</span><span id="val-density" class="value">--</span></div>
</div>

<div id="status-panel">
  <span>Estado Geomagnético</span>
  <span id="status-value" class="calm">CALMA</span>
</div>

<div id="timestamp-panel">
  <div>ÚLTIMA MEDICIÓN:</div>
  <div id="val-timestamp" style="color:#7ec8ff; margin-top:3px;">--</div>
</div>

<div id="controls-info">
  <div><b>🖱 Arrastrar</b> · rotar</div>
  <div><b>🖱 Rueda</b> · zoom</div>
  <div><b>Tecla C</b> · cámara auto</div>
  <div><b>Tecla R</b> · reset vista</div>
</div>

<script>
/* ============================================================
   CONFIG
   ============================================================ */
const PROXY_URL = 'https://nasa-proxy-magnetosfera.onrender.com/api/omni';

const state = {
  bz: 0, speed: 400, density: 5,
  cinemaMode: true, lastData: null,
  stormIntensity: 0,
};

/* ============================================================
   BABYLON
   ============================================================ */
const canvas = document.getElementById('renderCanvas');
const engine = new BABYLON.Engine(canvas, true, {
  preserveDrawingBuffer: true, stencil: true, antialias: true
});

let scene, camera, earth;
let atmosphere, innerGlow;
let magnetoFieldGroup;
let solarWind, auroraN, auroraS;
let glowLayer;
let flashOverlay = document.getElementById('flash-overlay');

/* ============================================================
   SHADER ATMÓSFERA — elegante, sutil, con Fresnel controlado
   ============================================================ */
const atmoVertex = `
precision highp float;
attribute vec3 position;
attribute vec3 normal;
uniform mat4 worldViewProjection;
uniform mat4 world;
varying vec3 vNormal;
varying vec3 vWorldPos;
void main() {
  vNormal = normalize(normal);
  vec4 wp = world * vec4(position, 1.0);
  vWorldPos = wp.xyz;
  gl_Position = worldViewProjection * vec4(position, 1.0);
}
`;

const atmoFragment = `
precision highp float;
varying vec3 vNormal;
varying vec3 vWorldPos;
uniform vec3 sunDir;
uniform float intensity;
uniform float stormFactor;
uniform float time;
uniform float layerType; // 0 = halo cyan exterior, 1 = limbo dorado

void main() {
  vec3 N = normalize(vNormal);
  vec3 V = normalize(cameraPosition - vWorldPos);
  vec3 L = normalize(sunDir);

  float fresnel = pow(1.0 - max(dot(N, V), 0.0), 3.5);
  float sunFacing = max(dot(N, L), 0.0);

  vec3 color;
  float alpha;

  if (layerType < 0.5) {
    // Halo exterior: cyan-azul suave, sutil
    color = mix(vec3(0.15, 0.5, 0.85), vec3(0.4, 0.75, 1.0), fresnel);
    alpha = fresnel * intensity * (0.35 + sunFacing * 0.6);
  } else {
    // Limbo interior: dorado cálido
    float goldFactor = pow(sunFacing, 1.5);
    color = mix(vec3(1.0, 0.6, 0.25), vec3(1.0, 0.9, 0.55), goldFactor);
    alpha = fresnel * intensity * (0.2 + sunFacing * 0.9);
  }

  // Tormenta: pulso sutil
  alpha += stormFactor * 0.1 * (0.5 + 0.5 * sin(time * 2.0));

  gl_FragColor = vec4(color, alpha);
}
`;

/* ============================================================
   ESCENA
   ============================================================ */
function createScene() {
  scene = new BABYLON.Scene(engine);
  // Fondo azul muy profundo con un toque de cian
  scene.clearColor = new BABYLON.Color4(0.008, 0.02, 0.05, 1);

  camera = new BABYLON.ArcRotateCamera('cam', -Math.PI/2 + 0.4, Math.PI/2.2, 13, BABYLON.Vector3.Zero(), scene);
  camera.attachControl(canvas, true);
  camera.lowerRadiusLimit = 5;
  camera.upperRadiusLimit = 50;
  camera.wheelDeltaPercentage = 0.015;
  camera.inertia = 0.9;
  camera.panningSensibility = 0;
  camera.minZ = 0.1;

  // Luces - bien equilibradas para que la Tierra se vea
  const hemi = new BABYLON.HemisphericLight('hemi', new BABYLON.Vector3(0, 1, 0), scene);
  hemi.intensity = 0.45;
  hemi.diffuse = new BABYLON.Color3(0.6, 0.75, 1.0);
  hemi.groundColor = new BABYLON.Color3(0.08, 0.12, 0.22);

  const sun = new BABYLON.DirectionalLight('sun', new BABYLON.Vector3(-1, 0, 0), scene);
  sun.position = new BABYLON.Vector3(30, 0, 0);
  sun.intensity = 2.0;
  sun.diffuse = new BABYLON.Color3(1, 0.97, 0.92);

  createBackdrop();
  createStarfield();
  createEarth();
  createAtmosphere();
  createMagneticField();
  createSolarWind();
  createAuroras();
  createPostFX();

  return scene;
}

/* ============================================================
   FONDO — gradiente radial elegante
   ============================================================ */
function createBackdrop() {
  const dome = BABYLON.MeshBuilder.CreateSphere('backdrop', { diameter: 400, segments: 32 }, scene);

  BABYLON.Effect.ShadersStore['backdropV'] = `
    precision highp float;
    attribute vec3 position;
    attribute vec3 normal;
    uniform mat4 worldViewProjection;
    varying vec3 vLocal;
    void main() {
      vLocal = position;
      gl_Position = worldViewProjection * vec4(position, 1.0);
    }
  `;
  BABYLON.Effect.ShadersStore['backdropF'] = `
    precision highp float;
    varying vec3 vLocal;
    void main() {
      vec3 dir = normalize(vLocal);
      float y = dir.y;
      float r = length(dir.xz);

      // Gradiente radial suave: centro azul tenue → bordes oscuros
      vec3 centerCol = vec3(0.03, 0.06, 0.14);
      vec3 edgeCol = vec3(0.002, 0.005, 0.015);

      float radial = smoothstep(0.0, 1.2, r);
      vec3 color = mix(centerCol, edgeCol, radial);

      // Toque de azul arriba
      color += vec3(0.01, 0.025, 0.06) * max(0.0, y);

      gl_FragColor = vec4(color, 1.0);
    }
  `;

  const mat = new BABYLON.ShaderMaterial('backdropMat', scene, {
    vertex: 'backdrop', fragment: 'backdrop'
  }, {
    attributes: ['position', 'normal'],
    uniforms: ['worldViewProjection']
  });
  mat.backFaceCulling = false;
  dome.material = mat;
  dome.isPickable = false;
}

/* ============================================================
   ESTRELLAS — sutiles, con tamaños variados
   ============================================================ */
function createStarfield() {
  const starfield = new BABYLON.ParticleSystem('stars', 2000, scene);
  starfield.emitter = BABYLON.Vector3.Zero();
  starfield.minEmitBox = new BABYLON.Vector3(-150, -150, -150);
  starfield.maxEmitBox = new BABYLON.Vector3(150, 150, 150);
  starfield.color1 = new BABYLON.Color4(1, 1, 1, 0.9);
  starfield.color2 = new BABYLON.Color4(0.75, 0.85, 1, 0.85);
  starfield.colorDead = new BABYLON.Color4(1, 1, 1, 0.9);
  starfield.minSize = 0.02;
  starfield.maxSize = 0.11;
  starfield.minLifeTime = 99999;
  starfield.maxLifeTime = 99999;
  starfield.emitRate = 0;
  starfield.manualEmitCount = 2000;
  starfield.minEmitPower = 0;
  starfield.maxEmitPower = 0;
  starfield.updateSpeed = 0;
  starfield.start();
  starfield.stop();
}

/* ============================================================
   TIERRA — textura nítida, bien iluminada
   ============================================================ */
function createEarth() {
  earth = BABYLON.MeshBuilder.CreateSphere('earth', { diameter: 4, segments: 96 }, scene);
  const mat = new BABYLON.StandardMaterial('earthMat', scene);

  // Textura realista
  const tex = new BABYLON.Texture(
    'https://cdn.jsdelivr.net/gh/mrdoob/three.js@r150/examples/textures/planets/earth_atmos_2048.jpg',
    scene, false, true,
    BABYLON.Texture.TRILINEAR_SAMPLINGMODE,
    () => {},
    () => {
      // Fallback
      mat.diffuseColor = new BABYLON.Color3(0.2, 0.4, 0.7);
      mat.emissiveColor = new BABYLON.Color3(0.08, 0.18, 0.35);
    }
  );
  mat.diffuseTexture = tex;
  mat.specularColor = new BABYLON.Color3(0.25, 0.28, 0.35);
  mat.specularPower = 40;
  // Emisión para que el lado oscuro no sea negro absoluto
  mat.emissiveColor = new BABYLON.Color3(0.06, 0.08, 0.14);
  mat.ambientColor = new BABYLON.Color3(0.3, 0.4, 0.6);

  earth.material = mat;
}

/* ============================================================
   ATMÓSFERA — dos capas muy sutiles
   ============================================================ */
function createAtmosphere() {
  BABYLON.Effect.ShadersStore['atmoV'] = atmoVertex;
  BABYLON.Effect.ShadersStore['atmoF'] = atmoFragment;

  // Capa exterior: halo cyan suave
  atmosphere = BABYLON.MeshBuilder.CreateSphere('atmo', { diameter: 4.6, segments: 48 }, scene);
  const matOuter = new BABYLON.ShaderMaterial('atmoMat', scene, {
    vertex: 'atmo', fragment: 'atmo'
  }, {
    attributes: ['position', 'normal'],
    uniforms: ['world', 'worldViewProjection', 'sunDir', 'intensity', 'stormFactor', 'time', 'layerType'],
    needAlphaBlending: true
  });
  matOuter.setVector3('sunDir', new BABYLON.Vector3(-1, 0, 0));
  matOuter.setFloat('intensity', 1.1);
  matOuter.setFloat('stormFactor', 0);
  matOuter.setFloat('time', 0);
  matOuter.setFloat('layerType', 0);
  matOuter.backFaceCulling = false;
  atmosphere.material = matOuter;
  atmosphere.isPickable = false;

  // Capa interior: limbo dorado sutil
  innerGlow = BABYLON.MeshBuilder.CreateSphere('innerGlow', { diameter: 4.15, segments: 48 }, scene);
  const matInner = new BABYLON.ShaderMaterial('innerGlowMat', scene, {
    vertex: 'atmo', fragment: 'atmo'
  }, {
    attributes: ['position', 'normal'],
    uniforms: ['world', 'worldViewProjection', 'sunDir', 'intensity', 'stormFactor', 'time', 'layerType'],
    needAlphaBlending: true
  });
  matInner.setVector3('sunDir', new BABYLON.Vector3(-1, 0, 0));
  matInner.setFloat('intensity', 1.0);
  matInner.setFloat('stormFactor', 0);
  matInner.setFloat('time', 0);
  matInner.setFloat('layerType', 1);
  matInner.backFaceCulling = false;
  innerGlow.material = matInner;
  innerGlow.isPickable = false;
}

/* ============================================================
   CAMPO MAGNÉTICO — minimalista: 6 planos × 3 líneas = 18
   Finas, elegantes, con jerarquía sutil
   ============================================================ */
function createMagneticField() {
  magnetoFieldGroup = new BABYLON.TransformNode('fieldGroup', scene);

  const numPlanes = 6;
  const linesPerPlane = 3;

  for (let p = 0; p < numPlanes; p++) {
    const phi = (p / numPlanes) * Math.PI * 2;

    for (let i = 0; i < linesPerPlane; i++) {
      // Solo 3 líneas por plano: interior, media, exterior
      const L = 3.0 + i * 2.2;
      const isOuter = (i === linesPerPlane - 1);

      const pathPoints = [];
      const steps = 80;
      for (let s = 0; s <= steps; s++) {
        const theta = (s / steps) * Math.PI;
        const sinT = Math.sin(theta);
        const cosT = Math.cos(theta);
        const r0 = L * sinT * sinT;
        if (r0 < 2.02) continue;

        let x = r0 * sinT * Math.cos(phi);
        let y = r0 * cosT;
        let z = r0 * sinT * Math.sin(phi);

        // Deformación por viento solar (compresión día, estiramiento noche)
        if (x > 0) {
          x *= 0.78; y *= 0.9; z *= 0.9;
        } else {
          x *= 1.4; y *= 0.7;
        }

        pathPoints.push(new BABYLON.Vector3(x, y, z));
      }
      if (pathPoints.length < 4) continue;

      // Grosor diferenciado: exterior más gruesa
      const tubeRadius = isOuter ? 0.014 : 0.008;

      const tube = BABYLON.MeshBuilder.CreateTube('tube_' + p + '_' + i, {
        path: pathPoints,
        radius: tubeRadius,
        tessellation: 6,
        cap: BABYLON.Mesh.NO_CAP,
        updatable: false
      }, scene);

      const mat = new BABYLON.StandardMaterial('tubeMat_' + p + '_' + i, scene);

      // Color según capa
      if (isOuter) {
        mat.emissiveColor = new BABYLON.Color3(0.4, 0.85, 1.0);
        mat.alpha = 0.55;
      } else if (i === 1) {
        mat.emissiveColor = new BABYLON.Color3(0.3, 0.7, 1.0);
        mat.alpha = 0.4;
      } else {
        mat.emissiveColor = new BABYLON.Color3(0.5, 0.9, 0.8);
        mat.alpha = 0.3;
      }

      mat.diffuseColor = new BABYLON.Color3(0, 0, 0);
      mat.specularColor = new BABYLON.Color3(0, 0, 0);
      mat.disableLighting = true;

      tube.material = mat;
      tube.parent = magnetoFieldGroup;
      tube.isPickable = false;

      if (!magnetoFieldGroup.metadata) magnetoFieldGroup.metadata = [];
      magnetoFieldGroup.metadata.push({
        mat, baseAlpha: mat.alpha, isOuter
      });
    }
  }
}

/* ============================================================
   VIENTO SOLAR — partículas sutiles
   ============================================================ */
function createSolarWind() {
  solarWind = new BABYLON.ParticleSystem('solarWind', 1800, scene);
  solarWind.particleTexture = new BABYLON.Texture(
    'https://playground.babylonjs.com/textures/flare.png', scene
  );
  solarWind.emitter = new BABYLON.Vector3(30, 0, 0);
  solarWind.minEmitBox = new BABYLON.Vector3(-1, -14, -14);
  solarWind.maxEmitBox = new BABYLON.Vector3(1, 14, 14);
  solarWind.color1 = new BABYLON.Color4(1.0, 0.75, 0.4, 0.35);
  solarWind.color2 = new BABYLON.Color4(1.0, 0.5, 0.3, 0.25);
  solarWind.colorDead = new BABYLON.Color4(0, 0, 0, 0);
  solarWind.minSize = 0.04;
  solarWind.maxSize = 0.12;
  solarWind.minLifeTime = 2.5;
  solarWind.maxLifeTime = 4.0;
  solarWind.direction1 = new BABYLON.Vector3(-1, -0.02, -0.02);
  solarWind.direction2 = new BABYLON.Vector3(-1, 0.02, 0.02);
  solarWind.minEmitPower = 4;
  solarWind.maxEmitPower = 7;
  solarWind.updateSpeed = 0.016;
  solarWind.emitRate = 700;
  solarWind.blendMode = BABYLON.ParticleSystem.BLENDMODE_ADD;
  solarWind.gravity = new BABYLON.Vector3(0, 0, 0);
  solarWind.start();
}

/* ============================================================
   AURORAS — sutiles, elegantes
   ============================================================ */
function createAuroras() {
  auroraN = new BABYLON.ParticleSystem('auroraN', 600, scene);
  auroraN.particleTexture = new BABYLON.Texture(
    'https://playground.babylonjs.com/textures/flare.png', scene
  );
  auroraN.emitter = new BABYLON.Vector3(0, 2.02, 0);
  auroraN.minEmitBox = new BABYLON.Vector3(-0.85, 0, -0.85);
  auroraN.maxEmitBox = new BABYLON.Vector3(0.85, 0.35, 0.85);
  auroraN.color1 = new BABYLON.Color4(0.4, 1.0, 0.7, 0.5);
  auroraN.color2 = new BABYLON.Color4(0.5, 0.6, 1.0, 0.45);
  auroraN.colorDead = new BABYLON.Color4(0, 0, 0, 0);
  auroraN.minSize = 0.08;
  auroraN.maxSize = 0.35;
  auroraN.minLifeTime = 1.4;
  auroraN.maxLifeTime = 2.5;
  auroraN.emitRate = 30;
  auroraN.blendMode = BABYLON.ParticleSystem.BLENDMODE_ADD;
  auroraN.direction1 = new BABYLON.Vector3(-0.1, 0.5, -0.1);
  auroraN.direction2 = new BABYLON.Vector3(0.1, 1.0, 0.1);
  auroraN.minEmitPower = 0.25;
  auroraN.maxEmitPower = 0.7;
  auroraN.gravity = new BABYLON.Vector3(0, 0.2, 0);
  auroraN.start();

  auroraS = auroraN.clone('auroraS');
  auroraS.emitter = new BABYLON.Vector3(0, -2.02, 0);
  auroraS.direction1 = new BABYLON.Vector3(-0.1, -0.5, -0.1);
  auroraS.direction2 = new BABYLON.Vector3(0.1, -1.0, 0.1);
  auroraS.gravity = new BABYLON.Vector3(0, -0.2, 0);
  auroraS.start();
}

/* ============================================================
   POST-PROCESADO — sutil
   ============================================================ */
function createPostFX() {
  glowLayer = new BABYLON.GlowLayer('glow', scene);
  glowLayer.intensity = 0.4;
  glowLayer.blurKernelSize = 32;

  const pipeline = new BABYLON.DefaultRenderingPipeline('pipeline', true, scene, [camera]);
  pipeline.samples = 4;
  pipeline.fxaaEnabled = true;
  if (pipeline.imageProcessing) {
    pipeline.imageProcessing.vignetteEnabled = true;
    pipeline.imageProcessing.vignetteWeight = 3.5;
    pipeline.imageProcessing.vignetteStretch = 0.7;
    pipeline.imageProcessing.vignetteColor = new BABYLON.Color4(0, 0, 0, 0);
    pipeline.imageProcessing.contrast = 1.1;
    pipeline.imageProcessing.exposure = 1.0;
  }
  pipeline.bloomEnabled = true;
  pipeline.bloomThreshold = 0.9;
  pipeline.bloomWeight = 0.15;
  pipeline.bloomKernel = 48;
  pipeline.bloomScale = 0.5;
}

/* ============================================================
   ACTUALIZACIÓN VISUAL
   ============================================================ */
function updateVisuals() {
  const targetStorm = state.bz < 0 ? Math.min(1, Math.abs(state.bz) / 12) : 0;
  state.stormIntensity += (targetStorm - state.stormIntensity) * 0.03;
  const t = performance.now() * 0.001;

  if (atmosphere && atmosphere.material) {
    atmosphere.material.setFloat('stormFactor', state.stormIntensity);
    atmosphere.material.setFloat('time', t);
  }
  if (innerGlow && innerGlow.material) {
    innerGlow.material.setFloat('stormFactor', state.stormIntensity);
    innerGlow.material.setFloat('time', t);
  }

  // Viento solar
  if (solarWind) {
    const speedNorm = Math.max(0.5, state.speed / 500);
    solarWind.emitRate = 600 * speedNorm;
    solarWind.minEmitPower = 3 * speedNorm;
    solarWind.maxEmitPower = 6 * speedNorm;

    if (state.bz < -5) {
      solarWind.color1 = new BABYLON.Color4(1.0, 0.4, 0.2, 0.55);
      solarWind.color2 = new BABYLON.Color4(1.0, 0.25, 0.4, 0.4);
    } else {
      solarWind.color1 = new BABYLON.Color4(1.0, 0.75, 0.4, 0.35);
      solarWind.color2 = new BABYLON.Color4(1.0, 0.5, 0.3, 0.25);
    }
  }

  // Líneas magnéticas
  if (magnetoFieldGroup && magnetoFieldGroup.metadata) {
    magnetoFieldGroup.metadata.forEach((item) => {
      const alphaBoost = state.stormIntensity * 0.15;
      item.mat.alpha = Math.min(0.85, item.baseAlpha + alphaBoost);

      if (state.bz < -5) {
        item.mat.emissiveColor = item.isOuter
          ? new BABYLON.Color3(1.0, 0.5, 0.25)
          : new BABYLON.Color3(1.0, 0.65, 0.4);
      } else if (state.bz < -2) {
        item.mat.emissiveColor = item.isOuter
          ? new BABYLON.Color3(0.6, 0.9, 1.0)
          : new BABYLON.Color3(0.5, 0.8, 1.0);
      } else {
        item.mat.emissiveColor = item.isOuter
          ? new BABYLON.Color3(0.4, 0.85, 1.0)
          : new BABYLON.Color3(0.5, 0.9, 0.8);
      }
    });
  }

  // Auroras
  if (auroraN && auroraS) {
    const rate = 25 + state.stormIntensity * 200;
    auroraN.emitRate = rate;
    auroraS.emitRate = rate;
    auroraN.maxSize = 0.3 + state.stormIntensity * 0.4;
    auroraS.maxSize = 0.3 + state.stormIntensity * 0.4;
  }

  if (state.stormIntensity > 0.5) {
    flashOverlay.style.opacity = (state.stormIntensity - 0.5) * 0.7;
  } else {
    flashOverlay.style.opacity = 0;
  }
}

/* ============================================================
   HUD
   ============================================================ */
function updateHUD() {
  const elBz = document.getElementById('val-bz');
  const elSpeed = document.getElementById('val-speed');
  const elDensity = document.getElementById('val-density');
  const elStatus = document.getElementById('status-value');
  const elTimestamp = document.getElementById('val-timestamp');

  elBz.textContent = state.bz.toFixed(2) + ' nT';
  elSpeed.textContent = state.speed.toFixed(0) + ' km/s';
  elDensity.textContent = state.density.toFixed(2) + ' n/cc';

  elBz.classList.remove('ok', 'warn', 'alert');
  if (state.bz < -8) elBz.classList.add('alert');
  else if (state.bz < -3) elBz.classList.add('warn');
  else elBz.classList.add('ok');

  elSpeed.classList.remove('ok', 'warn', 'alert');
  if (state.speed > 650) elSpeed.classList.add('alert');
  else if (state.speed > 500) elSpeed.classList.add('warn');
  else elSpeed.classList.add('ok');

  elStatus.classList.remove('calm', 'perturbed', 'storm');
  if (state.bz < -8 || state.speed > 700) {
    elStatus.textContent = 'TORMENTA';
    elStatus.classList.add('storm');
  } else if (state.bz < -3 || state.speed > 500) {
    elStatus.textContent = 'PERTURBADO';
    elStatus.classList.add('perturbed');
  } else {
    elStatus.textContent = 'CALMA';
    elStatus.classList.add('calm');
  }

  if (state.lastData && state.lastData.timestamp) {
    const t = new Date(state.lastData.timestamp);
    elTimestamp.textContent = t.toUTCString().split(' ').slice(0, 5).join(' ');
  }
}

/* ============================================================
   FETCH AL PROXY
   ============================================================ */
async function fetchData() {
  try {
    const res = await fetch(PROXY_URL);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    state.bz = Number(data.bz) || 0;
    state.speed = Number(data.speed) || 400;
    state.density = Number(data.density) || 5;
    state.lastData = data;
    updateHUD();
  } catch (err) {
    console.warn('Proxy no responde:', err.message);
    state.bz = (Math.random() * 10) - 5;
    state.speed = 380 + Math.random() * 180;
    state.density = 3 + Math.random() * 5;
    updateHUD();
  }
}

/* ============================================================
   CÁMARA
   ============================================================ */
function updateCinema() {
  if (!state.cinemaMode) return;
  camera.alpha += 0.0007;
  const t = performance.now() * 0.00012;
  camera.beta = Math.PI / 2.2 + Math.sin(t) * 0.06;
}

window.addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  if (k === 'c') state.cinemaMode = !state.cinemaMode;
  if (k === 'r') {
    camera.alpha = -Math.PI / 2 + 0.4;
    camera.beta = Math.PI / 2.2;
    camera.radius = 13;
  }
});

/* ============================================================
   LOOP
   ============================================================ */
let lastTime = performance.now();
function animate() {
  const now = performance.now();
  const dt = (now - lastTime) * 0.001;
  lastTime = now;

  if (earth) earth.rotation.y += dt * 0.025;
  if (magnetoFieldGroup) magnetoFieldGroup.rotation.y = earth ? earth.rotation.y : 0;
  if (atmosphere) atmosphere.rotation.y = earth ? earth.rotation.y : 0;
  if (innerGlow) innerGlow.rotation.y = earth ? earth.rotation.y : 0;

  updateCinema();
  updateVisuals();
}

/* ============================================================
   ARRANQUE
   ============================================================ */
scene = createScene();
engine.runRenderLoop(() => {
  animate();
  scene.render();
});

window.addEventListener('resize', () => engine.resize());

fetchData().then(() => {
  document.getElementById('loading').classList.add('hidden');
});
setInterval(fetchData, 60000);
setInterval(updateHUD, 100);
</script>
