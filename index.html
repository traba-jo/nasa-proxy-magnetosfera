<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌍 Magnetósfera Terrestre · NASA Live</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Segoe UI', -apple-system, sans-serif; }
  #renderCanvas { width: 100%; height: 100%; touch-action: none; display: block; outline: none; }

  #hud {
    position: absolute; top: 20px; left: 20px;
    color: #7fffd4;
    background: linear-gradient(135deg, rgba(0,20,40,0.8), rgba(0,10,25,0.65));
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    padding: 18px 22px;
    border-radius: 14px;
    border: 1px solid rgba(0,255,200,0.2);
    box-shadow: 0 8px 32px rgba(0,255,180,0.06), inset 0 0 20px rgba(0,255,200,0.03);
    pointer-events: none;
    z-index: 100;
    min-width: 270px;
    font-family: 'Courier New', monospace;
  }
  #hud h1 {
    font-size: 12px;
    letter-spacing: 3px;
    color: #00ffcc;
    text-transform: uppercase;
    margin-bottom: 12px;
    font-weight: 600;
    text-shadow: 0 0 10px rgba(0,255,200,0.5);
  }
  .data-row { display: flex; justify-content: space-between; align-items: center; margin: 7px 0; font-size: 12px; }
  .label { color: #6b9ea0; letter-spacing: 1px; }
  .value { color: #fff; font-weight: 700; font-size: 14px; text-shadow: 0 0 6px rgba(0,255,200,0.3); }
  .value.alert { color: #ff4466; text-shadow: 0 0 10px rgba(255,60,90,0.7); }
  .value.warn { color: #ffcc33; text-shadow: 0 0 10px rgba(255,200,50,0.7); }
  .value.ok { color: #44ff99; text-shadow: 0 0 10px rgba(70,255,150,0.5); }

  #status-panel {
    position: absolute; bottom: 20px; left: 20px;
    padding: 12px 18px;
    background: linear-gradient(135deg, rgba(0,20,40,0.8), rgba(0,10,25,0.65));
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-radius: 12px;
    border: 1px solid rgba(0,255,200,0.18);
    color: #7fffd4;
    font-family: 'Courier New', monospace;
    z-index: 100;
    letter-spacing: 2px;
    font-size: 11px;
    text-transform: uppercase;
  }
  #status-value {
    font-size: 16px;
    font-weight: 800;
    letter-spacing: 4px;
    margin-top: 3px;
    display: block;
    transition: color 0.4s;
  }
  #status-value.calm { color: #44ff99; text-shadow: 0 0 18px rgba(70,255,150,0.7); }
  #status-value.perturbed { color: #ffcc33; text-shadow: 0 0 18px rgba(255,200,50,0.7); }
  #status-value.storm { color: #ff4466; text-shadow: 0 0 22px rgba(255,60,90,0.85); animation: pulse 1.3s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

  #timestamp-panel {
    position: absolute; bottom: 20px; right: 20px;
    padding: 9px 16px;
    background: rgba(0,15,30,0.65);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-radius: 8px;
    border: 1px solid rgba(0,255,200,0.12);
    color: #5a8f8f;
    font-family: 'Courier New', monospace;
    font-size: 10px;
    letter-spacing: 1px;
    z-index: 100;
    text-align: right;
  }

  #controls-info {
    position: absolute; top: 20px; right: 20px;
    padding: 9px 14px;
    background: rgba(0,15,30,0.55);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-radius: 8px;
    border: 1px solid rgba(0,255,200,0.12);
    color: #5a8f8f;
    font-family: 'Courier New', monospace;
    font-size: 10px;
    letter-spacing: 1px;
    z-index: 100;
    line-height: 1.7;
  }
  #controls-info b { color: #00ffcc; }

  #loading {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: #000;
    color: #00ffcc;
    font-family: 'Courier New', monospace;
    letter-spacing: 4px;
    z-index: 200;
    transition: opacity 0.8s;
    flex-direction: column;
    gap: 18px;
  }
  #loading.hidden { opacity: 0; pointer-events: none; }
  .loader-ring {
    width: 55px; height: 55px;
    border: 2px solid rgba(0,255,200,0.12);
    border-top-color: #00ffcc;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    box-shadow: 0 0 25px rgba(0,255,200,0.35);
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loading-text { font-size: 11px; }

  #flash-overlay {
    position: absolute; inset: 0;
    background: radial-gradient(circle at center, rgba(255,60,90,0.35), transparent 70%);
    opacity: 0;
    pointer-events: none;
    z-index: 150;
    transition: opacity 0.5s;
  }

  #scanlines {
    position: absolute; inset: 0;
    background: repeating-linear-gradient(0deg, rgba(0,255,200,0.015) 0px, rgba(0,255,200,0.015) 1px, transparent 1px, transparent 3px);
    pointer-events: none;
    z-index: 90;
    mix-blend-mode: screen;
  }

  @media (max-width: 640px) {
    #hud { transform: scale(0.78); transform-origin: top left; }
    #status-panel { transform: scale(0.82); transform-origin: bottom left; }
    #controls-info { display: none; }
  }
</style>
<script src="https://cdn.babylonjs.com/babylon.js"></script>
</head>
<body>
<canvas id="renderCanvas"></canvas>
<div id="scanlines"></div>
<div id="flash-overlay"></div>

<div id="loading">
  <div class="loader-ring"></div>
  <div id="loading-text">CARGANDO MAGNETOSFERA...</div>
</div>

<div id="hud">
  <h1>◈ TELEMETRÍA NASA EN VIVO</h1>
  <div class="data-row"><span class="label">Bz (GSM)</span><span id="val-bz" class="value">--</span></div>
  <div class="data-row"><span class="label">Velocidad</span><span id="val-speed" class="value">--</span></div>
  <div class="data-row"><span class="label">Densidad</span><span id="val-density" class="value">--</span></div>
</div>

<div id="status-panel">
  <span>Estado Geomagnético</span>
  <span id="status-value" class="calm">CALMA</span>
</div>

<div id="timestamp-panel">
  <div>ÚLTIMA MEDICIÓN:</div>
  <div id="val-timestamp" style="color:#00ffcc; margin-top:3px;">--</div>
</div>

<div id="controls-info">
  <div><b>🖱 Arrastrar</b> · rotar</div>
  <div><b>🖱 Rueda</b> · zoom</div>
  <div><b>Tecla C</b> · cámara auto</div>
  <div><b>Tecla R</b> · reset vista</div>
</div>

<script>
/* ============================================================
   CONFIGURACIÓN
   ============================================================ */
const PROXY_URL = 'https://nasa-proxy-magnetosfera.onrender.com/api/omni';

const state = {
  bz: 0,
  speed: 400,
  density: 5,
  cinemaMode: true,
  lastData: null,
  stormIntensity: 0,
};

/* ============================================================
   BABYLON
   ============================================================ */
const canvas = document.getElementById('renderCanvas');
const engine = new BABYLON.Engine(canvas, true, {
  preserveDrawingBuffer: true,
  stencil: true,
  antialias: true
});

let scene, camera, earth, atmosphere, sunLight;
let magnetoLines = [];
let solarWind, auroraN, auroraS;
let vanAllen1, vanAllen2;
let glowLayer;
let flashOverlay = document.getElementById('flash-overlay');

/* ============================================================
   ESCENA
   ============================================================ */
function createScene() {
  scene = new BABYLON.Scene(engine);
  scene.clearColor = new BABYLON.Color4(0.001, 0.005, 0.015, 1);

  // Cámara
  camera = new BABYLON.ArcRotateCamera('cam', -Math.PI/2, Math.PI/2.3, 14, BABYLON.Vector3.Zero(), scene);
  camera.attachControl(canvas, true);
  camera.lowerRadiusLimit = 5;
  camera.upperRadiusLimit = 45;
  camera.wheelDeltaPercentage = 0.015;
  camera.inertia = 0.88;
  camera.panningSensibility = 0;

  // Luces
  const hemi = new BABYLON.HemisphericLight('hemi', new BABYLON.Vector3(0, 1, 0), scene);
  hemi.intensity = 0.35;
  hemi.diffuse = new BABYLON.Color3(0.4, 0.5, 0.8);

  sunLight = new BABYLON.DirectionalLight('sun', new BABYLON.Vector3(-1, 0, 0), scene);
  sunLight.position = new BABYLON.Vector3(30, 0, 0);
  sunLight.intensity = 1.6;
  sunLight.diffuse = new BABYLON.Color3(1, 0.95, 0.85);

  // Estrellas
  createStarfield();

  // Tierra con textura real NASA Blue Marble
  createEarth();

  // Atmósfera Fresnel sutil
  createAtmosphere();

  // Líneas de campo magnético
  createMagneticField();

  // Van Allen sutiles
  createVanAllenBelts();

  // Viento solar
  createSolarWind();

  // Auroras
  createAuroras();

  // Glow layer controlado
  glowLayer = new BABYLON.GlowLayer('glow', scene);
  glowLayer.intensity = 0.6;
  glowLayer.blurKernelSize = 32;

  // Post-procesado cinematográfico
  const pipeline = new BABYLON.DefaultRenderingPipeline('pipeline', true, scene, [camera]);
  pipeline.samples = 4;
  pipeline.fxaaEnabled = true;
  if (pipeline.imageProcessing) {
    pipeline.imageProcessing.vignetteEnabled = true;
    pipeline.imageProcessing.vignetteWeight = 3.0;
    pipeline.imageProcessing.vignetteStretch = 0.6;
    pipeline.imageProcessing.vignetteColor = new BABYLON.Color4(0, 0, 0, 0);
    pipeline.imageProcessing.contrast = 1.1;
    pipeline.imageProcessing.exposure = 1.0;
  }
  pipeline.bloomEnabled = true;
  pipeline.bloomThreshold = 0.85;
  pipeline.bloomWeight = 0.18;
  pipeline.bloomKernel = 48;

  return scene;
}

/* ============================================================
   ESTRELLAS
   ============================================================ */
function createStarfield() {
  const starfield = new BABYLON.ParticleSystem('stars', 2000, scene);
  starfield.emitter = BABYLON.Vector3.Zero();
  starfield.minEmitBox = new BABYLON.Vector3(-100, -100, -100);
  starfield.maxEmitBox = new BABYLON.Vector3(100, 100, 100);
  starfield.color1 = new BABYLON.Color4(1, 1, 1, 1);
  starfield.color2 = new BABYLON.Color4(0.75, 0.85, 1, 1);
  starfield.colorDead = new BABYLON.Color4(1, 1, 1, 1);
  starfield.minSize = 0.04;
  starfield.maxSize = 0.15;
  starfield.minLifeTime = 99999;
  starfield.maxLifeTime = 99999;
  starfield.emitRate = 0;
  starfield.manualEmitCount = 2000;
  starfield.minEmitPower = 0;
  starfield.maxEmitPower = 0;
  starfield.updateSpeed = 0;
  starfield.start();
  starfield.stop();
}

/* ============================================================
   TIERRA CON TEXTURA NASA BLUE MARBLE
   La NASA distribuye "Blue Marble" públicamente vía su servidor
   de visualización y también a través del GMT data server [citation:9][citation:14].
   ============================================================ */
function createEarth() {
  earth = BABYLON.MeshBuilder.CreateSphere('earth', { diameter: 4, segments: 64 }, scene);

  const mat = new BABYLON.StandardMaterial('earthMat', scene);

  // Textura difusa NASA Blue Marble (público dominio)
  mat.diffuseTexture = new BABYLON.Texture(
    'https://eoimages.gsfc.nasa.gov/images/imagerecords/74000/74393/world.topo.200412.3x5400x2700.jpg',
    scene
  );
  mat.diffuseTexture.uScale = 1;
  mat.diffuseTexture.vScale = 1;

  // Sin especular fuerte (la Tierra no brilla como metal)
  mat.specularColor = new BABYLON.Color3(0.02, 0.02, 0.03);
  mat.specularPower = 24;

  // Emisión mínima para el lado oscuro
  mat.emissiveColor = new BABYLON.Color3(0.02, 0.02, 0.05);

  earth.material = mat;
}

/* ============================================================
   ATMÓSFERA FRESNEL (sutil)
   ============================================================ */
function createAtmosphere() {
  atmosphere = BABYLON.MeshBuilder.CreateSphere('atmo', { diameter: 4.15, segments: 32 }, scene);

  const atmoMat = new BABYLON.StandardMaterial('atmoMat', scene);
  atmoMat.emissiveColor = new BABYLON.Color3(0.15, 0.45, 1.0);
  atmoMat.alpha = 0.10;
  atmoMat.backFaceCulling = false;
  atmoMat.disableLighting = true;
  atmosphere.material = atmoMat;
}

/* ============================================================
   CAMPO MAGNÉTICO DIPOLAR REAL
   Fórmula: r = L * sin²(θ) para líneas de campo dipolares.
   Esto genera las líneas en forma de "huevo" correctamente
   orientadas desde el polo norte al sur magnético.
   ============================================================ */
function createMagneticField() {
  const numPlanes = 6;
  const numLinesPerPlane = 3;

  for (let p = 0; p < numPlanes; p++) {
    const phi = (p / numPlanes) * Math.PI * 2;
    for (let i = 0; i < numLinesPerPlane; i++) {
      const L = 2.8 + i * 1.6;
      const points = [];
      const steps = 48;
      for (let s = 0; s <= steps; s++) {
        const theta = (s / steps) * Math.PI;
        const r = L * Math.sin(theta) * Math.sin(theta);
        if (r < 2.05) continue;
        const x = r * Math.sin(theta) * Math.cos(phi);
        const y = r * Math.cos(theta);
        const z = r * Math.sin(theta) * Math.sin(phi);
        points.push(new BABYLON.Vector3(x, y, z));
      }
      if (points.length < 2) continue;

      const line = BABYLON.MeshBuilder.CreateLines('magLine_' + p + '_' + i, { points }, scene);
      line.color = new BABYLON.Color3(0.1, 0.7, 1.0);
      line.alpha = 0.22 - i * 0.04;
      line.isPickable = false;
      magnetoLines.push({ mesh: line, baseAlpha: line.alpha });
    }
  }
}

/* ============================================================
   VAN ALLEN (sutiles, casi imperceptibles)
   ============================================================ */
function createVanAllenBelts() {
  const belt1 = BABYLON.MeshBuilder.CreateTorus('belt1', {
    diameter: 8.5, thickness: 0.15, tessellation: 64
  }, scene);
  belt1.rotation.x = Math.PI / 2;
  belt1.scaling.y = 0.4;
  const mat1 = new BABYLON.StandardMaterial('belt1mat', scene);
  mat1.emissiveColor = new BABYLON.Color3(1.0, 0.35, 0.1);
  mat1.alpha = 0.05;
  mat1.backFaceCulling = false;
  mat1.disableLighting = true;
  belt1.material = mat1;
  belt1.isPickable = false;
  vanAllen1 = belt1;

  const belt2 = BABYLON.MeshBuilder.CreateTorus('belt2', {
    diameter: 12.5, thickness: 0.2, tessellation: 64
  }, scene);
  belt2.rotation.x = Math.PI / 2;
  belt2.scaling.y = 0.35;
  const mat2 = new BABYLON.StandardMaterial('belt2mat', scene);
  mat2.emissiveColor = new BABYLON.Color3(0.1, 0.5, 1.0);
  mat2.alpha = 0.03;
  mat2.backFaceCulling = false;
  mat2.disableLighting = true;
  belt2.material = mat2;
  belt2.isPickable = false;
  vanAllen2 = belt2;
}

/* ============================================================
   VIENTO SOLAR
   ============================================================ */
function createSolarWind() {
  solarWind = new BABYLON.ParticleSystem('solarWind', 2500, scene);
  solarWind.particleTexture = new BABYLON.Texture(
    'https://playground.babylonjs.com/textures/flare.png', scene
  );

  solarWind.emitter = new BABYLON.Vector3(28, 0, 0);
  solarWind.minEmitBox = new BABYLON.Vector3(-1, -12, -12);
  solarWind.maxEmitBox = new BABYLON.Vector3(1, 12, 12);

  solarWind.color1 = new BABYLON.Color4(1.0, 0.7, 0.2, 0.6);
  solarWind.color2 = new BABYLON.Color4(1.0, 0.35, 0.08, 0.5);
  solarWind.colorDead = new BABYLON.Color4(0, 0, 0, 0);

  solarWind.minSize = 0.06;
  solarWind.maxSize = 0.18;
  solarWind.minLifeTime = 2.2;
  solarWind.maxLifeTime = 3.8;

  solarWind.direction1 = new BABYLON.Vector3(-1, -0.03, -0.03);
  solarWind.direction2 = new BABYLON.Vector3(-1, 0.03, 0.03);

  solarWind.minEmitPower = 4;
  solarWind.maxEmitPower = 7;
  solarWind.updateSpeed = 0.016;
  solarWind.emitRate = 1400;
  solarWind.blendMode = BABYLON.ParticleSystem.BLENDMODE_ADD;
  solarWind.gravity = new BABYLON.Vector3(0, 0, 0);
  solarWind.start();
}

/* ============================================================
   AURORAS
   ============================================================ */
function createAuroras() {
  auroraN = new BABYLON.ParticleSystem('auroraN', 800, scene);
  auroraN.particleTexture = new BABYLON.Texture(
    'https://playground.babylonjs.com/textures/flare.png', scene
  );
  auroraN.emitter = new BABYLON.Vector3(0, 2.05, 0);
  auroraN.minEmitBox = new BABYLON.Vector3(-0.8, 0, -0.8);
  auroraN.maxEmitBox = new BABYLON.Vector3(0.8, 0.4, 0.8);
  auroraN.color1 = new BABYLON.Color4(0.2, 1.0, 0.4, 0.5);
  auroraN.color2 = new BABYLON.Color4(0.4, 0.3, 1.0, 0.4);
  auroraN.colorDead = new BABYLON.Color4(0, 0, 0, 0);
  auroraN.minSize = 0.08;
  auroraN.maxSize = 0.3;
  auroraN.minLifeTime = 1.0;
  auroraN.maxLifeTime = 2.0;
  auroraN.emitRate = 40;
  auroraN.blendMode = BABYLON.ParticleSystem.BLENDMODE_ADD;
  auroraN.direction1 = new BABYLON.Vector3(-0.1, 0.5, -0.1);
  auroraN.direction2 = new BABYLON.Vector3(0.1, 1.0, 0.1);
  auroraN.minEmitPower = 0.2;
  auroraN.maxEmitPower = 0.6;
  auroraN.gravity = new BABYLON.Vector3(0, 0.2, 0);
  auroraN.start();

  auroraS = auroraN.clone('auroraS');
  auroraS.emitter = new BABYLON.Vector3(0, -2.05, 0);
  auroraS.direction1 = new BABYLON.Vector3(-0.1, -0.5, -0.1);
  auroraS.direction2 = new BABYLON.Vector3(0.1, -1.0, 0.1);
  auroraS.gravity = new BABYLON.Vector3(0, -0.2, 0);
  auroraS.start();
}

/* ============================================================
   ACTUALIZACIÓN VISUAL
   ============================================================ */
function updateVisuals() {
  const targetStorm = state.bz < 0 ? Math.min(1, Math.abs(state.bz) / 12) : 0;
  state.stormIntensity += (targetStorm - state.stormIntensity) * 0.04;

  if (solarWind) {
    const speedNorm = Math.max(0.6, state.speed / 500);
    solarWind.emitRate = 1000 * speedNorm;
    solarWind.minEmitPower = 3 * speedNorm;
    solarWind.maxEmitPower = 6 * speedNorm;

    if (state.bz < -5) {
      solarWind.color1 = new BABYLON.Color4(1.0, 0.3, 0.15, 0.7);
      solarWind.color2 = new BABYLON.Color4(0.9, 0.15, 0.4, 0.6);
    } else {
      solarWind.color1 = new BABYLON.Color4(1.0, 0.7, 0.2, 0.6);
      solarWind.color2 = new BABYLON.Color4(1.0, 0.35, 0.08, 0.5);
    }
  }

  magnetoLines.forEach((item) => {
    const alphaBoost = state.stormIntensity * 0.35;
    item.mesh.alpha = Math.min(0.7, item.baseAlpha + alphaBoost);
    if (state.bz < -5) {
      item.mesh.color = new BABYLON.Color3(1.0, 0.45, 0.15);
    } else {
      item.mesh.color = new BABYLON.Color3(0.1, 0.7, 1.0);
    }
  });

  if (auroraN && auroraS) {
    const rate = 20 + state.stormIntensity * 180;
    auroraN.emitRate = rate;
    auroraS.emitRate = rate;
  }

  if (vanAllen1 && vanAllen2) {
    vanAllen1.material.alpha = 0.04 + state.stormIntensity * 0.10;
    vanAllen2.material.alpha = 0.02 + state.stormIntensity * 0.07;
  }

  if (state.stormIntensity > 0.5) {
    flashOverlay.style.opacity = (state.stormIntensity - 0.5) * 1.1;
  } else {
    flashOverlay.style.opacity = 0;
  }
}

/* ============================================================
   HUD
   ============================================================ */
function updateHUD() {
  const elBz = document.getElementById('val-bz');
  const elSpeed = document.getElementById('val-speed');
  const elDensity = document.getElementById('val-density');
  const elStatus = document.getElementById('status-value');
  const elTimestamp = document.getElementById('val-timestamp');

  elBz.textContent = state.bz.toFixed(2) + ' nT';
  elSpeed.textContent = state.speed.toFixed(0) + ' km/s';
  elDensity.textContent = state.density.toFixed(2) + ' n/cc';

  elBz.classList.remove('ok', 'warn', 'alert');
  if (state.bz < -8) elBz.classList.add('alert');
  else if (state.bz < -3) elBz.classList.add('warn');
  else elBz.classList.add('ok');

  elSpeed.classList.remove('ok', 'warn', 'alert');
  if (state.speed > 650) elSpeed.classList.add('alert');
  else if (state.speed > 500) elSpeed.classList.add('warn');
  else elSpeed.classList.add('ok');

  elStatus.classList.remove('calm', 'perturbed', 'storm');
  if (state.bz < -8 || state.speed > 700) {
    elStatus.textContent = 'TORMENTA';
    elStatus.classList.add('storm');
  } else if (state.bz < -3 || state.speed > 500) {
    elStatus.textContent = 'PERTURBADO';
    elStatus.classList.add('perturbed');
  } else {
    elStatus.textContent = 'CALMA';
    elStatus.classList.add('calm');
  }

  if (state.lastData && state.lastData.timestamp) {
    const t = new Date(state.lastData.timestamp);
    elTimestamp.textContent = t.toUTCString().split(' ').slice(0, 5).join(' ');
  }
}

/* ============================================================
   FETCH AL PROXY
   ============================================================ */
async function fetchData() {
  try {
    const res = await fetch(PROXY_URL);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();

    state.bz = Number(data.bz) || 0;
    state.speed = Number(data.speed) || 400;
    state.density = Number(data.density) || 5;
    state.lastData = data;

    updateHUD();
  } catch (err) {
    console.warn('Proxy no responde:', err.message);
    state.bz = (Math.random() * 12) - 6;
    state.speed = 380 + Math.random() * 220;
    state.density = 3 + Math.random() * 5;
    updateHUD();
  }
}

/* ============================================================
   CÁMARA CINEMATOGRÁFICA
   ============================================================ */
function updateCinema() {
  if (!state.cinemaMode) return;
  camera.alpha += 0.0008;
  const t = performance.now() * 0.00015;
  camera.beta = Math.PI / 2.3 + Math.sin(t) * 0.08;
}

/* ============================================================
   INPUT
   ============================================================ */
window.addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  if (k === 'c') state.cinemaMode = !state.cinemaMode;
  if (k === 'r') {
    camera.alpha = -Math.PI / 2;
    camera.beta = Math.PI / 2.3;
    camera.radius = 14;
  }
});

/* ============================================================
   LOOP
   ============================================================ */
let lastTime = performance.now();
function animate() {
  const now = performance.now();
  const dt = (now - lastTime) * 0.001;
  lastTime = now;

  if (earth) earth.rotation.y += dt * 0.04;
  magnetoLines.forEach(item => { item.mesh.rotation.y = earth.rotation.y; });
  if (vanAllen1) vanAllen1.rotation.z += dt * 0.02;
  if (vanAllen2) vanAllen2.rotation.z -= dt * 0.015;

  updateCinema();
  updateVisuals();
}

/* ============================================================
   ARRANQUE
   ============================================================ */
scene = createScene();
engine.runRenderLoop(() => {
  animate();
  scene.render();
});

window.addEventListener('resize', () => engine.resize());

fetchData().then(() => {
  document.getElementById('loading').classList.add('hidden');
});
setInterval(fetchData, 60000);
setInterval(updateHUD, 100);
</script>
