<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌍 Magnetósfera Terrestre · NASA Live</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Segoe UI', -apple-system, sans-serif; }
  #renderCanvas { width: 100%; height: 100%; touch-action: none; display: block; outline: none; }

  #hud {
    position: absolute; top: 18px; left: 18px;
    background: linear-gradient(135deg, rgba(0,20,40,0.85), rgba(0,10,25,0.7));
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    padding: 16px 20px; border-radius: 14px;
    border: 1px solid rgba(0,255,200,0.25);
    box-shadow: 0 8px 32px rgba(0,255,180,0.08), inset 0 0 20px rgba(0,255,200,0.04);
    pointer-events: none; z-index: 100; min-width: 260px;
    font-family: 'Courier New', monospace;
  }
  #hud h1 { font-size: 12px; letter-spacing: 3px; color: #00ffcc; text-transform: uppercase; margin-bottom: 12px; font-weight: 600; text-shadow: 0 0 10px rgba(0,255,200,0.5); }
  .data-row { display: flex; justify-content: space-between; align-items: center; margin: 7px 0; font-size: 12px; }
  .label { color: #6b9ea0; letter-spacing: 1px; }
  .value { color: #fff; font-weight: 700; font-size: 14px; text-shadow: 0 0 6px rgba(0,255,200,0.3); }
  .value.alert { color: #ff4466; text-shadow: 0 0 10px rgba(255,60,90,0.7); }
  .value.warn { color: #ffcc33; text-shadow: 0 0 10px rgba(255,200,50,0.7); }
  .value.ok { color: #44ff99; text-shadow: 0 0 10px rgba(70,255,150,0.5); }

  #status-panel {
    position: absolute; bottom: 18px; left: 18px;
    padding: 12px 18px;
    background: linear-gradient(135deg, rgba(0,20,40,0.85), rgba(0,10,25,0.7));
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-radius: 12px; border: 1px solid rgba(0,255,200,0.2);
    color: #7fffd4; font-family: 'Courier New', monospace;
    z-index: 100; letter-spacing: 2px; font-size: 11px; text-transform: uppercase;
  }
  #status-value { font-size: 16px; font-weight: 800; letter-spacing: 4px; margin-top: 3px; display: block; transition: color 0.4s; }
  #status-value.calm { color: #44ff99; text-shadow: 0 0 18px rgba(70,255,150,0.7); }
  #status-value.perturbed { color: #ffcc33; text-shadow: 0 0 18px rgba(255,200,50,0.7); }
  #status-value.storm { color: #ff4466; text-shadow: 0 0 22px rgba(255,60,90,0.85); animation: pulse 1.3s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

  #timestamp-panel {
    position: absolute; bottom: 18px; right: 18px;
    padding: 9px 16px; background: rgba(0,15,30,0.7);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-radius: 8px; border: 1px solid rgba(0,255,200,0.15);
    color: #5a8f8f; font-family: 'Courier New', monospace;
    font-size: 10px; letter-spacing: 1px; z-index: 100; text-align: right;
  }

  #controls-info {
    position: absolute; top: 18px; right: 18px;
    padding: 9px 14px; background: rgba(0,15,30,0.6);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-radius: 8px; border: 1px solid rgba(0,255,200,0.15);
    color: #5a8f8f; font-family: 'Courier New', monospace;
    font-size: 10px; letter-spacing: 1px; z-index: 100; line-height: 1.7;
  }
  #controls-info b { color: #00ffcc; }

  #loading {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: #000; color: #00ffcc;
    font-family: 'Courier New', monospace; letter-spacing: 4px;
    z-index: 200; transition: opacity 1s;
    flex-direction: column; gap: 18px;
  }
  #loading.hidden { opacity: 0; pointer-events: none; }
  .loader-ring {
    width: 55px; height: 55px;
    border: 2px solid rgba(0,255,200,0.15);
    border-top-color: #00ffcc; border-radius: 50%;
    animation: spin 1s linear infinite;
    box-shadow: 0 0 25px rgba(0,255,200,0.4);
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loading-text { font-size: 11px; }

  #flash-overlay {
    position: absolute; inset: 0;
    background: radial-gradient(circle at center, rgba(255,60,90,0.4), transparent 70%);
    opacity: 0; pointer-events: none; z-index: 150; transition: opacity 0.5s;
  }
  #scanlines {
    position: absolute; inset: 0;
    background: repeating-linear-gradient(0deg, rgba(0,255,200,0.012) 0px, rgba(0,255,200,0.012) 1px, transparent 1px, transparent 3px);
    pointer-events: none; z-index: 90; mix-blend-mode: screen;
  }
  @media (max-width: 640px) {
    #hud { transform: scale(0.78); transform-origin: top left; }
    #status-panel { transform: scale(0.82); transform-origin: bottom left; }
    #controls-info { display: none; }
  }
</style>
<script src="https://cdn.babylonjs.com/babylon.js"></script>
</head>
<body>
<canvas id="renderCanvas"></canvas>
<div id="scanlines"></div>
<div id="flash-overlay"></div>

<div id="loading">
  <div class="loader-ring"></div>
  <div id="loading-text">CARGANDO MAGNETOSFERA...</div>
</div>

<div id="hud">
  <h1>◈ TELEMETRÍA NASA EN VIVO</h1>
  <div class="data-row"><span class="label">Bz (GSM)</span><span id="val-bz" class="value">--</span></div>
  <div class="data-row"><span class="label">Velocidad</span><span id="val-speed" class="value">--</span></div>
  <div class="data-row"><span class="label">Densidad</span><span id="val-density" class="value">--</span></div>
</div>

<div id="status-panel">
  <span>Estado Geomagnético</span>
  <span id="status-value" class="calm">CALMA</span>
</div>

<div id="timestamp-panel">
  <div>ÚLTIMA MEDICIÓN:</div>
  <div id="val-timestamp" style="color:#00ffcc; margin-top:3px;">--</div>
</div>

<div id="controls-info">
  <div><b>🖱 Arrastrar</b> · rotar</div>
  <div><b>🖱 Rueda</b> · zoom</div>
  <div><b>Tecla C</b> · cámara auto</div>
  <div><b>Tecla R</b> · reset vista</div>
</div>

<script>
/* ============================================================
   CONFIG
   ============================================================ */
const PROXY_URL = 'https://nasa-proxy-magnetosfera.onrender.com/api/omni';

const state = {
  bz: 0, speed: 400, density: 5,
  cinemaMode: true, lastData: null,
  stormIntensity: 0,
};

/* ============================================================
   BABYLON
   ============================================================ */
const canvas = document.getElementById('renderCanvas');
const engine = new BABYLON.Engine(canvas, true, {
  preserveDrawingBuffer: true, stencil: true, antialias: true
});

let scene, camera, earth, earthMat;
let atmosphereOuter, atmosphereInner;
let haloRing;
let magnetoFieldGroup;
let solarWind, auroraN, auroraS;
let polarBeams = [];
let glowLayer;
let flashOverlay = document.getElementById('flash-overlay');

/* ============================================================
   SHADER ATMÓSFERA — multicapa con Fresnel dorado/cyan
   ============================================================ */
const atmoVertex = `
precision highp float;
attribute vec3 position;
attribute vec3 normal;
uniform mat4 worldViewProjection;
uniform mat4 world;
varying vec3 vNormal;
varying vec3 vWorldPos;
void main() {
  vNormal = normalize(normal);
  vec4 wp = world * vec4(position, 1.0);
  vWorldPos = wp.xyz;
  gl_Position = worldViewProjection * vec4(position, 1.0);
}
`;

const atmoFragment = `
precision highp float;
varying vec3 vNormal;
varying vec3 vWorldPos;
uniform vec3 sunDir;
uniform float intensity;
uniform float stormFactor;
uniform float time;
uniform float isOuter; // 1.0 = capa exterior, 0.0 = interior

void main() {
  vec3 N = normalize(vNormal);
  vec3 V = normalize(cameraPosition - vWorldPos);
  vec3 L = normalize(sunDir);

  float fresnel = pow(1.0 - max(dot(N, V), 0.0), 3.0);
  float sunFacing = max(dot(N, L), 0.0);
  float dayMask = smoothstep(-0.3, 0.6, sunFacing);

  // Capa exterior: azul-cyan profundo
  // Capa interior: dorado-verde brillante en el limbo
  vec3 colOuter = vec3(0.1, 0.5, 1.0);
  vec3 colOuter2 = vec3(0.4, 0.8, 1.0);
  vec3 colInner = vec3(0.9, 0.75, 0.35);   // dorado
  vec3 colInner2 = vec3(0.5, 1.0, 0.6);    // verde

  vec3 color;
  if (isOuter > 0.5) {
    color = mix(colOuter, colOuter2, fresnel);
  } else {
    // Mezcla según ángulo respecto al Sol (dorado al horizonte)
    float goldMix = pow(max(0.0, dot(N, L)), 1.2);
    color = mix(colInner2, colInner, goldMix);
    color = mix(color, vec3(1.0, 0.95, 0.7), pow(goldMix, 3.0) * 0.7);
  }

  // Alpha por fresnel
  float alpha = fresnel * intensity * (0.5 + dayMask * 0.5);
  // Pulsación durante tormenta
  alpha += stormFactor * 0.2 * (0.5 + 0.5 * sin(time * 3.0));

  gl_FragColor = vec4(color, alpha);
}
`;

/* ============================================================
   ESCENA
   ============================================================ */
function createScene() {
  scene = new BABYLON.Scene(engine);
  // Fondo azul profundo (no negro) para dar ambiente "poster NASA"
  scene.clearColor = new BABYLON.Color4(0.01, 0.025, 0.07, 1);

  camera = new BABYLON.ArcRotateCamera('cam', -Math.PI/2 + 0.35, Math.PI/2.15, 14, BABYLON.Vector3.Zero(), scene);
  camera.attachControl(canvas, true);
  camera.lowerRadiusLimit = 6;
  camera.upperRadiusLimit = 55;
  camera.wheelDeltaPercentage = 0.015;
  camera.inertia = 0.88;
  camera.panningSensibility = 0;
  camera.minZ = 0.1;

  const hemi = new BABYLON.HemisphericLight('hemi', new BABYLON.Vector3(0, 1, 0), scene);
  hemi.intensity = 0.28;
  hemi.diffuse = new BABYLON.Color3(0.5, 0.6, 0.9);
  hemi.groundColor = new BABYLON.Color3(0.05, 0.08, 0.18);

  const sun = new BABYLON.DirectionalLight('sun', new BABYLON.Vector3(-1, 0, 0), scene);
  sun.position = new BABYLON.Vector3(30, 0, 0);
  sun.intensity = 1.7;
  sun.diffuse = new BABYLON.Color3(1, 0.97, 0.9);

  createBackdrop();
  createStarfield();
  createEarth();
  createAtmosphere();
  createHaloRing();
  createMagneticField();
  createPolarBeams();
  createSolarWind();
  createAuroras();
  createPostFX();

  return scene;
}

/* ============================================================
   FONDO RADIAL — gradiente azul profundo tipo poster
   ============================================================ */
function createBackdrop() {
  const dome = BABYLON.MeshBuilder.CreateSphere('backdrop', { diameter: 400, segments: 32 }, scene);

  BABYLON.Effect.ShadersStore['backdropV'] = `
    precision highp float;
    attribute vec3 position;
    attribute vec3 normal;
    uniform mat4 worldViewProjection;
    varying vec3 vLocal;
    void main() {
      vLocal = position;
      gl_Position = worldViewProjection * vec4(position, 1.0);
    }
  `;
  BABYLON.Effect.ShadersStore['backdropF'] = `
    precision highp float;
    varying vec3 vLocal;
    void main() {
      vec3 dir = normalize(vLocal);
      float y = dir.y;

      // Gradiente vertical: azul profundo arriba, casi negro abajo
      vec3 topCol = vec3(0.015, 0.045, 0.12);
      vec3 midCol = vec3(0.02, 0.05, 0.14);
      vec3 botCol = vec3(0.002, 0.008, 0.025);

      float t = smoothstep(-0.9, 0.9, y);
      vec3 color = mix(botCol, midCol, smoothstep(-1.0, 0.0, y));
      color = mix(color, topCol, t);

      // Manchas de nebulosa tenues
      float n1 = sin(dir.x * 3.1 + 1.7) * cos(dir.y * 2.4 - 0.5) * 0.5 + 0.5;
      float n2 = sin(dir.x * 7.3 - 2.1) * cos(dir.y * 5.5 + 1.3) * 0.5 + 0.5;
      float neb = pow(n1 * 0.6 + n2 * 0.4, 3.0) * 0.22;
      color += vec3(0.03, 0.08, 0.22) * neb;

      // Destello tenue en la parte superior (efecto "amanecer espacial")
      float topGlow = pow(max(0.0, y), 4.0);
      color += vec3(0.05, 0.12, 0.25) * topGlow;

      gl_FragColor = vec4(color, 1.0);
    }
  `;

  const mat = new BABYLON.ShaderMaterial('backdropMat', scene, {
    vertex: 'backdrop', fragment: 'backdrop'
  }, {
    attributes: ['position', 'normal'],
    uniforms: ['worldViewProjection']
  });
  mat.backFaceCulling = false;
  dome.material = mat;
  dome.isPickable = false;
}

/* ============================================================
   ESTRELLAS
   ============================================================ */
function createStarfield() {
  const starfield = new BABYLON.ParticleSystem('stars', 4000, scene);
  starfield.emitter = BABYLON.Vector3.Zero();
  starfield.minEmitBox = new BABYLON.Vector3(-160, -160, -160);
  starfield.maxEmitBox = new BABYLON.Vector3(160, 160, 160);
  starfield.color1 = new BABYLON.Color4(1, 1, 1, 1);
  starfield.color2 = new BABYLON.Color4(0.8, 0.85, 1, 1);
  starfield.colorDead = new BABYLON.Color4(1, 1, 1, 1);
  starfield.minSize = 0.03;
  starfield.maxSize = 0.15;
  starfield.minLifeTime = 99999;
  starfield.maxLifeTime = 99999;
  starfield.emitRate = 0;
  starfield.manualEmitCount = 4000;
  starfield.minEmitPower = 0;
  starfield.maxEmitPower = 0;
  starfield.updateSpeed = 0;
  starfield.start();
  starfield.stop();
}

/* ============================================================
   TIERRA
   ============================================================ */
function createEarth() {
  earth = BABYLON.MeshBuilder.CreateSphere('earth', { diameter: 4, segments: 64 }, scene);
  earthMat = new BABYLON.StandardMaterial('earthMat', scene);

  const tex = new BABYLON.Texture(
    'https://cdn.jsdelivr.net/gh/mrdoob/three.js@r150/examples/textures/planets/earth_atmos_2048.jpg',
    scene, false, false,
    BABYLON.Texture.TRILINEAR_SAMPLINGMODE,
    () => {},
    () => {
      earthMat.diffuseColor = new BABYLON.Color3(0.15, 0.3, 0.55);
      earthMat.emissiveColor = new BABYLON.Color3(0.08, 0.15, 0.28);
    }
  );
  earthMat.diffuseTexture = tex;
  earthMat.specularColor = new BABYLON.Color3(0.2, 0.22, 0.3);
  earthMat.specularPower = 28;
  earthMat.emissiveColor = new BABYLON.Color3(0.05, 0.06, 0.1);
  earthMat.ambientColor = new BABYLON.Color3(0.15, 0.18, 0.28);
  earth.material = earthMat;
}

/* ============================================================
   ATMÓSFERA — dos capas: exterior azul y interior dorada
   ============================================================ */
function createAtmosphere() {
  BABYLON.Effect.ShadersStore['atmoV'] = atmoVertex;
  BABYLON.Effect.ShadersStore['atmoF'] = atmoFragment;

  atmosphereOuter = BABYLON.MeshBuilder.CreateSphere('atmoOuter', { diameter: 5.4, segments: 48 }, scene);
  const matOuter = new BABYLON.ShaderMaterial('atmoMatOuter', scene, {
    vertex: 'atmo', fragment: 'atmo'
  }, {
    attributes: ['position', 'normal'],
    uniforms: ['world', 'worldViewProjection', 'sunDir', 'intensity', 'stormFactor', 'time', 'isOuter'],
    needAlphaBlending: true
  });
  matOuter.setVector3('sunDir', new BABYLON.Vector3(-1, 0, 0));
  matOuter.setFloat('intensity', 1.6);
  matOuter.setFloat('stormFactor', 0);
  matOuter.setFloat('time', 0);
  matOuter.setFloat('isOuter', 1.0);
  matOuter.backFaceCulling = false;
  atmosphereOuter.material = matOuter;
  atmosphereOuter.isPickable = false;

  atmosphereInner = BABYLON.MeshBuilder.CreateSphere('atmoInner', { diameter: 4.4, segments: 48 }, scene);
  const matInner = new BABYLON.ShaderMaterial('atmoMatInner', scene, {
    vertex: 'atmo', fragment: 'atmo'
  }, {
    attributes: ['position', 'normal'],
    uniforms: ['world', 'worldViewProjection', 'sunDir', 'intensity', 'stormFactor', 'time', 'isOuter'],
    needAlphaBlending: true
  });
  matInner.setVector3('sunDir', new BABYLON.Vector3(-1, 0, 0));
  matInner.setFloat('intensity', 2.4);
  matInner.setFloat('stormFactor', 0);
  matInner.setFloat('time', 0);
  matInner.setFloat('isOuter', 0.0);
  matInner.backFaceCulling = false;
  atmosphereInner.material = matInner;
  atmosphereInner.isPickable = false;
}

/* ============================================================
   HALO RING — anillo ecuatorial tenue tipo "aurora ecuatorial"
   ============================================================ */
function createHaloRing() {
  haloRing = BABYLON.MeshBuilder.CreateTorus('haloRing', {
    diameter: 5.6, thickness: 0.06, tessellation: 96
  }, scene);
  haloRing.rotation.x = Math.PI / 2;
  const mat = new BABYLON.StandardMaterial('haloMat', scene);
  mat.emissiveColor = new BABYLON.Color3(1.0, 0.7, 0.3);
  mat.diffuseColor = new BABYLON.Color3(0, 0, 0);
  mat.specularColor = new BABYLON.Color3(0, 0, 0);
  mat.alpha = 0.35;
  mat.disableLighting = true;
  haloRing.material = mat;
  haloRing.isPickable = false;
}

/* ============================================================
   CAMPO MAGNÉTICO — dipolo con jerarquía visual
   Líneas exteriores gruesas y brillantes, interiores finas y tenues.
   ============================================================ */
function createMagneticField() {
  magnetoFieldGroup = new BABYLON.TransformNode('fieldGroup', scene);

  const numPlanes = 12;
  const linesPerPlane = 4;

  for (let p = 0; p < numPlanes; p++) {
    const phi = (p / numPlanes) * Math.PI * 2;
    for (let i = 0; i < linesPerPlane; i++) {
      const L = 2.3 + i * 1.7;
      const isOuter = i === linesPerPlane - 1; // la más externa, gruesa

      const pathPoints = [];
      const steps = 90;
      for (let s = 0; s <= steps; s++) {
        const theta = (s / steps) * Math.PI;
        const sinT = Math.sin(theta);
        const cosT = Math.cos(theta);
        const r0 = L * sinT * sinT;
        if (r0 < 2.05) continue;

        let x = r0 * sinT * Math.cos(phi);
        let y = r0 * cosT;
        let z = r0 * sinT * Math.sin(phi);

        // Deformación por viento solar (surge desde +X)
        if (x > 0) {
          x *= 0.7; y *= 0.88; z *= 0.88;
        } else {
          x *= 1.35; y *= 0.65;
        }

        pathPoints.push(new BABYLON.Vector3(x, y, z));
      }
      if (pathPoints.length < 4) continue;

      // Grosor según capa
      const tubeRadius = isOuter ? 0.04 : 0.018 + (linesPerPlane - i) * 0.004;

      const tube = BABYLON.MeshBuilder.CreateTube('tube_' + p + '_' + i, {
        path: pathPoints,
        radius: tubeRadius,
        tessellation: 8,
        cap: BABYLON.Mesh.NO_CAP,
        updatable: false
      }, scene);

      const mat = new BABYLON.StandardMaterial('tubeMat_' + p + '_' + i, scene);

      // Paleta con jerarquía:
      // Exterior: cyan brillante
      // Medio: cyan suave
      // Interior: verde-cyan tenue
      if (isOuter) {
        mat.emissiveColor = new BABYLON.Color3(0.3, 0.95, 1.0);
        mat.alpha = 0.85;
      } else if (i >= 2) {
        mat.emissiveColor = new BABYLON.Color3(0.2, 0.75, 1.0);
        mat.alpha = 0.5;
      } else {
        mat.emissiveColor = new BABYLON.Color3(0.4, 1.0, 0.7);
        mat.alpha = 0.35;
      }

      mat.diffuseColor = new BABYLON.Color3(0, 0, 0);
      mat.specularColor = new BABYLON.Color3(0, 0, 0);
      mat.disableLighting = true;

      tube.material = mat;
      tube.parent = magnetoFieldGroup;
      tube.isPickable = false;

      if (!magnetoFieldGroup.metadata) magnetoFieldGroup.metadata = [];
      magnetoFieldGroup.metadata.push({
        mesh: tube, mat, baseAlpha: mat.alpha, isOuter
      });
    }
  }
}

/* ============================================================
   HACES POLARES — el detalle estrella de la referencia
   8 rayos de luz dorada/cyan saliendo de cada polo.
   ============================================================ */
function createPolarBeams() {
  const beamCount = 8;
  const beamLength = 2.2;
  const beamRadius = 0.06;

  for (let hemi = 0; hemi < 2; hemi++) {
    const dir = hemi === 0 ? 1 : -1; // 1 = norte, -1 = sur
    for (let i = 0; i < beamCount; i++) {
      const angle = (i / beamCount) * Math.PI * 2;
      const tilt = 0.35 + Math.random() * 0.15;

      // Punto de partida: cerca del polo
      const startX = Math.cos(angle) * 0.6;
      const startZ = Math.sin(angle) * 0.6;
      const startY = dir * 1.95;

      // Punto final: hacia afuera y arriba
      const endX = Math.cos(angle) * (0.6 + tilt * 2.2);
      const endZ = Math.sin(angle) * (0.6 + tilt * 2.2);
      const endY = dir * (1.95 + beamLength);

      const beam = BABYLON.MeshBuilder.CreateTube('beam_' + hemi + '_' + i, {
        path: [
          new BABYLON.Vector3(startX, startY, startZ),
          new BABYLON.Vector3(startX * 1.15, startY + dir * beamLength * 0.5, startZ * 1.15),
          new BABYLON.Vector3(endX, endY, endZ)
        ],
        radius: beamRadius,
        tessellation: 8,
        cap: BABYLON.Mesh.NO_CAP,
        updatable: false
      }, scene);

      const mat = new BABYLON.StandardMaterial('beamMat_' + hemi + '_' + i, scene);
      // Alternar dorado y cyan
      if (i % 2 === 0) {
        mat.emissiveColor = new BABYLON.Color3(1.0, 0.85, 0.4);
      } else {
        mat.emissiveColor = new BABYLON.Color3(0.5, 0.9, 1.0);
      }
      mat.diffuseColor = new BABYLON.Color3(0, 0, 0);
      mat.specularColor = new BABYLON.Color3(0, 0, 0);
      mat.alpha = 0.6;
      mat.disableLighting = true;
      beam.material = mat;
      beam.isPickable = false;
      beam.parent = magnetoFieldGroup;
      polarBeams.push({ mesh: beam, mat, baseAlpha: 0.6 });
    }
  }
}

/* ============================================================
   VIENTO SOLAR — partículas variadas
   ============================================================ */
function createSolarWind() {
  solarWind = new BABYLON.ParticleSystem('solarWind', 3500, scene);
  solarWind.particleTexture = new BABYLON.Texture(
    'https://playground.babylonjs.com/textures/flare.png', scene
  );
  solarWind.emitter = new BABYLON.Vector3(35, 0, 0);
  solarWind.minEmitBox = new BABYLON.Vector3(-1, -18, -18);
  solarWind.maxEmitBox = new BABYLON.Vector3(1, 18, 18);
  solarWind.color1 = new BABYLON.Color4(1.0, 0.75, 0.3, 0.7);
  solarWind.color2 = new BABYLON.Color4(1.0, 0.5, 0.5, 0.5);
  solarWind.colorDead = new BABYLON.Color4(0, 0, 0, 0);
  solarWind.minSize = 0.05;
  solarWind.maxSize = 0.18;
  solarWind.minLifeTime = 2.5;
  solarWind.maxLifeTime = 4.5;
  solarWind.direction1 = new BABYLON.Vector3(-1, -0.02, -0.02);
  solarWind.direction2 = new BABYLON.Vector3(-1, 0.02, 0.02);
  solarWind.minEmitPower = 4;
  solarWind.maxEmitPower = 7;
  solarWind.updateSpeed = 0.016;
  solarWind.emitRate = 1500;
  solarWind.blendMode = BABYLON.ParticleSystem.BLENDMODE_ADD;
  solarWind.gravity = new BABYLON.Vector3(0, 0, 0);
  solarWind.start();
}

/* ============================================================
   AURORAS — más vistosas
   ============================================================ */
function createAuroras() {
  auroraN = new BABYLON.ParticleSystem('auroraN', 1500, scene);
  auroraN.particleTexture = new BABYLON.Texture(
    'https://playground.babylonjs.com/textures/flare.png', scene
  );
  auroraN.emitter = new BABYLON.Vector3(0, 2.05, 0);
  auroraN.minEmitBox = new BABYLON.Vector3(-1.2, 0, -1.2);
  auroraN.maxEmitBox = new BABYLON.Vector3(1.2, 0.6, 1.2);
  auroraN.color1 = new BABYLON.Color4(0.3, 1.0, 0.5, 0.8);
  auroraN.color2 = new BABYLON.Color4(0.6, 0.4, 1.0, 0.7);
  auroraN.colorDead = new BABYLON.Color4(0, 0, 0, 0);
  auroraN.minSize = 0.12;
  auroraN.maxSize = 0.55;
  auroraN.minLifeTime = 1.2;
  auroraN.maxLifeTime = 2.8;
  auroraN.emitRate = 80;
  auroraN.blendMode = BABYLON.ParticleSystem.BLENDMODE_ADD;
  auroraN.direction1 = new BABYLON.Vector3(-0.2, 0.6, -0.2);
  auroraN.direction2 = new BABYLON.Vector3(0.2, 1.4, 0.2);
  auroraN.minEmitPower = 0.4;
  auroraN.maxEmitPower = 1.0;
  auroraN.gravity = new BABYLON.Vector3(0, 0.3, 0);
  auroraN.start();

  auroraS = auroraN.clone('auroraS');
  auroraS.emitter = new BABYLON.Vector3(0, -2.05, 0);
  auroraS.direction1 = new BABYLON.Vector3(-0.2, -0.6, -0.2);
  auroraS.direction2 = new BABYLON.Vector3(0.2, -1.4, 0.2);
  auroraS.gravity = new BABYLON.Vector3(0, -0.3, 0);
  auroraS.start();
}

/* ============================================================
   POST-PROCESADO
   ============================================================ */
function createPostFX() {
  glowLayer = new BABYLON.GlowLayer('glow', scene);
  glowLayer.intensity = 0.85;
  glowLayer.blurKernelSize = 48;

  const pipeline = new BABYLON.DefaultRenderingPipeline('pipeline', true, scene, [camera]);
  pipeline.samples = 4;
  pipeline.fxaaEnabled = true;
  if (pipeline.imageProcessing) {
    pipeline.imageProcessing.vignetteEnabled = true;
    pipeline.imageProcessing.vignetteWeight = 3.0;
    pipeline.imageProcessing.vignetteStretch = 0.6;
    pipeline.imageProcessing.vignetteColor = new BABYLON.Color4(0, 0, 0, 0);
    pipeline.imageProcessing.contrast = 1.18;
    pipeline.imageProcessing.exposure = 1.05;
  }
  pipeline.bloomEnabled = true;
  pipeline.bloomThreshold = 0.75;
  pipeline.bloomWeight = 0.4;
  pipeline.bloomKernel = 64;
  pipeline.bloomScale = 0.5;
}

/* ============================================================
   ACTUALIZACIÓN VISUAL
   ============================================================ */
function updateVisuals() {
  const targetStorm = state.bz < 0 ? Math.min(1, Math.abs(state.bz) / 12) : 0;
  state.stormIntensity += (targetStorm - state.stormIntensity) * 0.035;
  const t = performance.now() * 0.001;

  if (atmosphereOuter && atmosphereOuter.material) {
    atmosphereOuter.material.setFloat('stormFactor', state.stormIntensity);
    atmosphereOuter.material.setFloat('time', t);
  }
  if (atmosphereInner && atmosphereInner.material) {
    atmosphereInner.material.setFloat('stormFactor', state.stormIntensity);
    atmosphereInner.material.setFloat('time', t);
  }

  // Halo ring pulsa y se intensifica en tormenta
  if (haloRing) {
    haloRing.material.alpha = 0.28 + Math.sin(t * 1.2) * 0.05 + state.stormIntensity * 0.3;
    if (state.bz < -5) {
      haloRing.material.emissiveColor = new BABYLON.Color3(1.0, 0.35, 0.15);
    } else {
      haloRing.material.emissiveColor = new BABYLON.Color3(1.0, 0.7, 0.3);
    }
  }

  // Viento solar
  if (solarWind) {
    const speedNorm = Math.max(0.6, state.speed / 500);
    solarWind.emitRate = 1200 * speedNorm;
    solarWind.minEmitPower = 3 * speedNorm;
    solarWind.maxEmitPower = 6 * speedNorm;
    if (state.bz < -5) {
      solarWind.color1 = new BABYLON.Color4(1.0, 0.25, 0.1, 0.8);
      solarWind.color2 = new BABYLON.Color4(0.9, 0.1, 0.3, 0.7);
    } else {
      solarWind.color1 = new BABYLON.Color4(1.0, 0.75, 0.3, 0.7);
      solarWind.color2 = new BABYLON.Color4(1.0, 0.5, 0.5, 0.5);
    }
  }

  // Líneas magnéticas: cambian color con tormenta
  if (magnetoFieldGroup && magnetoFieldGroup.metadata) {
    magnetoFieldGroup.metadata.forEach((item) => {
      const alphaBoost = state.stormIntensity * 0.2;
      item.mat.alpha = Math.min(0.9, item.baseAlpha + alphaBoost);

      if (state.bz < -5) {
        if (item.isOuter) {
          item.mat.emissiveColor = new BABYLON.Color3(1.0, 0.4, 0.15);
        } else {
          item.mat.emissiveColor = new BABYLON.Color3(1.0, 0.6, 0.3);
        }
      } else if (state.bz < -2) {
        item.mat.emissiveColor = item.isOuter
          ? new BABYLON.Color3(0.6, 1.0, 1.0)
          : new BABYLON.Color3(0.4, 0.9, 0.9);
      } else {
        item.mat.emissiveColor = item.isOuter
          ? new BABYLON.Color3(0.3, 0.95, 1.0)
          : new BABYLON.Color3(0.2, 0.75, 1.0);
      }
    });
  }

  // Haces polares: pulsan y se intensifican
  polarBeams.forEach((item, idx) => {
    const pulse = 0.5 + 0.5 * Math.sin(t * 2.0 + idx * 0.7);
    item.mat.alpha = item.baseAlpha * (0.7 + pulse * 0.3) + state.stormIntensity * 0.25;
    if (state.bz < -5) {
      item.mat.emissiveColor = new BABYLON.Color3(1.0, 0.4, 0.2);
    }
  });

  // Auroras
  if (auroraN && auroraS) {
    const rate = 60 + state.stormIntensity * 300;
    auroraN.emitRate = rate;
    auroraS.emitRate = rate;
    auroraN.maxSize = 0.4 + state.stormIntensity * 0.6;
    auroraS.maxSize = 0.4 + state.stormIntensity * 0.6;
  }

  // Flash de tormenta
  if (state.stormIntensity > 0.5) {
    flashOverlay.style.opacity = (state.stormIntensity - 0.5) * 1.0;
  } else {
    flashOverlay.style.opacity = 0;
  }
}

/* ============================================================
   HUD
   ============================================================ */
function updateHUD() {
  const elBz = document.getElementById('val-bz');
  const elSpeed = document.getElementById('val-speed');
  const elDensity = document.getElementById('val-density');
  const elStatus = document.getElementById('status-value');
  const elTimestamp = document.getElementById('val-timestamp');

  elBz.textContent = state.bz.toFixed(2) + ' nT';
  elSpeed.textContent = state.speed.toFixed(0) + ' km/s';
  elDensity.textContent = state.density.toFixed(2) + ' n/cc';

  elBz.classList.remove('ok', 'warn', 'alert');
  if (state.bz < -8) elBz.classList.add('alert');
  else if (state.bz < -3) elBz.classList.add('warn');
  else elBz.classList.add('ok');

  elSpeed.classList.remove('ok', 'warn', 'alert');
  if (state.speed > 650) elSpeed.classList.add('alert');
  else if (state.speed > 500) elSpeed.classList.add('warn');
  else elSpeed.classList.add('ok');

  elStatus.classList.remove('calm', 'perturbed', 'storm');
  if (state.bz < -8 || state.speed > 700) {
    elStatus.textContent = 'TORMENTA';
    elStatus.classList.add('storm');
  } else if (state.bz < -3 || state.speed > 500) {
    elStatus.textContent = 'PERTURBADO';
    elStatus.classList.add('perturbed');
  } else {
    elStatus.textContent = 'CALMA';
    elStatus.classList.add('calm');
  }

  if (state.lastData && state.lastData.timestamp) {
    const t = new Date(state.lastData.timestamp);
    elTimestamp.textContent = t.toUTCString().split(' ').slice(0, 5).join(' ');
  }
}

/* ============================================================
   FETCH AL PROXY
   ============================================================ */
async function fetchData() {
  try {
    const res = await fetch(PROXY_URL);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    state.bz = Number(data.bz) || 0;
    state.speed = Number(data.speed) || 400;
    state.density = Number(data.density) || 5;
    state.lastData = data;
    updateHUD();
  } catch (err) {
    console.warn('Proxy no responde:', err.message);
    state.bz = (Math.random() * 12) - 6;
    state.speed = 380 + Math.random() * 220;
    state.density = 3 + Math.random() * 5;
    updateHUD();
  }
}

/* ============================================================
   CÁMARA
   ============================================================ */
function updateCinema() {
  if (!state.cinemaMode) return;
  camera.alpha += 0.0008;
  const t = performance.now() * 0.00015;
  camera.beta = Math.PI / 2.15 + Math.sin(t) * 0.08;
}

window.addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  if (k === 'c') state.cinemaMode = !state.cinemaMode;
  if (k === 'r') {
    camera.alpha = -Math.PI / 2 + 0.35;
    camera.beta = Math.PI / 2.15;
    camera.radius = 14;
  }
});

/* ============================================================
   LOOP
   ============================================================ */
let lastTime = performance.now();
function animate() {
  const now = performance.now();
  const dt = (now - lastTime) * 0.001;
  lastTime = now;

  if (earth) earth.rotation.y += dt * 0.03;
  if (magnetoFieldGroup) magnetoFieldGroup.rotation.y = earth ? earth.rotation.y : 0;
  if (atmosphereOuter) atmosphereOuter.rotation.y = earth ? earth.rotation.y : 0;
  if (atmosphereInner) atmosphereInner.rotation.y = earth ? earth.rotation.y : 0;
  if (haloRing) haloRing.rotation.z += dt * 0.05;

  updateCinema();
  updateVisuals();
}

/* ============================================================
   ARRANQUE
   ============================================================ */
scene = createScene();
engine.runRenderLoop(() => {
  animate();
  scene.render();
});

window.addEventListener('resize', () => engine.resize());

fetchData().then(() => {
  document.getElementById('loading').classList.add('hidden');
});
setInterval(fetchData, 60000);
setInterval(updateHUD, 100);
</script>
